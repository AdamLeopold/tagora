[project]
name = "tagora"
version = "0.1.0"
description = "Tagora platform: sandboxed verification, capability cards, routing, settlement, MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.10",
  "cryptography>=42",
  "rapidfuzz>=3.9",
  "reportlab>=4.2",
  "pymupdf>=1.24",
  "httpx>=0.27",
]

[project.optional-dependencies]
bench = [
  "pypdf>=5",
  "pdfplumber>=0.11",
  "pdfminer.six>=20240706",
  "pymupdf4llm>=0.0.17",
  "markitdown[pdf]>=0.1",
  "rapidocr-onnxruntime>=1.3",
  "wordninja>=2",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tagora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
