name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build website
        working-directory: web
        env:
          VITE_APP_URL: /${{ github.event.repository.name }}/app/
        run: |
          npm ci
          npx vite build --base=/${{ github.event.repository.name }}/
      - name: Build demo app
        working-directory: app
        env:
          VITE_WEB_URL: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npx vite build --base=/${{ github.event.repository.name }}/app/
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r web/dist/. _site/
          cp -r app/dist/. _site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
